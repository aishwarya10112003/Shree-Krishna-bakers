# docker-compose.yml
# ---------------------------------------------------------------------------
# Local, ISOLATED infrastructure for development.
#
# This brings up PostgreSQL (the primary datastore) and Redis (the cache) as
# throwaway containers on your own machine. The app never touches any
# production database — everything here is local and seeded with mock data.
#
# Usage:
#   colima start            # start the Docker runtime once per machine boot
#   docker compose up -d    # start Postgres + Redis in the background
#   docker compose down     # stop them   (add -v to ALSO delete the data)
#   docker compose logs -f  # tail logs
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    container_name: krishna_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: krishna
      POSTGRES_PASSWORD: krishna_dev_pw
      POSTGRES_DB: krishna_bakers
    ports:
      - "5432:5432"
    volumes:
      # Named volume = data survives `docker compose down` (but not `down -v`).
      - krishna_pgdata:/var/lib/postgresql/data
    healthcheck:
      # Compose / scripts can wait on this before running migrations.
      test: ["CMD-SHELL", "pg_isready -U krishna -d krishna_bakers"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: krishna_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - krishna_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  krishna_pgdata:
  krishna_redisdata:
