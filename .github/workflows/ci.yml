name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    name: Backend (lint · typecheck · test · build)
    runs-on: ubuntu-latest

    # Real Postgres + Redis containers, mapped to localhost — the same URLs the
    # tests hardcode, so the suite runs unchanged in CI.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: krishna
          POSTGRES_PASSWORD: krishna_dev_pw
          POSTGRES_DB: krishna_bakers
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U krishna -d krishna_bakers"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://krishna:krishna_dev_pw@localhost:5432/krishna_bakers?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_access_secret_value_1234567890
      JWT_REFRESH_SECRET: ci_refresh_secret_value_1234567890
      MAIL_DRIVER: console

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend (lint · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
